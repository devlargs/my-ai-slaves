name: Release

on:
  push:
    branches: [main]
    # A docs or CI commit shouldn't mint a version, publish an installer and
    # prompt the installed app to update. Code changes still release automatically.
    paths-ignore:
      - "**.md"
      - ".github/**"
      - ".vscode/**"
      - "LICENSE"
  # Ship a release for an ignored-path commit (or re-run a failed one) on demand.
  workflow_dispatch:

permissions:
  contents: write

# One release at a time, and a run that has started is never cancelled:
# stopping one between the version-bump push and publishing its release would
# leave a tag whose release is still a draft. A newer push waits for the running release instead. GitHub keeps only the newest
# waiting run, which is fine: every run releases the tip of main (see the
# version job), so the newest one covers the pushes it replaced.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Works out the next patch version once, so the macOS and Windows builds stamp
  # the same number. Nothing is committed until the checks and both builds have
  # succeeded.
  #
  # It reads the branch tip, not the commit that triggered the run: a run that
  # waited behind another release has to see what that release already shipped.
  # Every later job uses the commit resolved here, so the checks, both builds and
  # the tag all cover one commit.
  #
  # Every version needs a change behind it: if nothing but version bumps landed
  # since the last release tag (the previous run already shipped this run's
  # commit), the run stops here and no version is minted.
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          # Full history and tags, to find the last release and what came after it.
          fetch-depth: 0

      - name: Compute next patch version
        id: version
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

          LAST_TAG=$(git tag --list 'v*.*.*' --merged HEAD --sort=-v:refname | head -n1)
          if [ -n "$LAST_TAG" ]; then
            CHANGES=$(git log --format='%h %s' "$LAST_TAG..HEAD" | grep -v ' chore: bump version to v' || true)
            if [ -z "$CHANGES" ]; then
              echo "::notice::Nothing new since $LAST_TAG, skipping the release."
              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Changes since $LAST_TAG:"
            echo "$CHANGES"
          fi

          # The higher of package.json and the last tag (they match since the
          # tag sits on the bump commit; older releases tagged the commit before it).
          PKG=$(node -p "require('./package.json').version")
          CURRENT=$(printf '%s\n%s\n' "$PKG" "${LAST_TAG#v}" | sort -V | tail -n1)
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          echo "version=$MAJOR.$MINOR.$((PATCH + 1))" >> "$GITHUB_OUTPUT"
          echo "release=true" >> "$GITHUB_OUTPUT"

  # The in-app updater offers every release, so a commit that fails these must not ship.
  checks:
    needs: version
    if: needs.version.outputs.release == 'true'
    uses: ./.github/workflows/checks.yml
    with:
      ref: ${{ needs.version.outputs.sha }}

  build:
    needs: [version, checks]
    name: build (${{ matrix.platform }})
    strategy:
      # Let both platforms finish, so one run shows every platform's problem.
      # The release still waits for both.
      fail-fast: false
      matrix:
        include:
          # One DMG per CPU (arm64 for Apple Silicon, x64 for Intel), both built
          # on the Apple Silicon runner. The in-app updater picks the one ending
          # in -<arch>.dmg for the Mac it runs on.
          - os: macos-latest
            platform: mac
            files: |
              packages/desktop/release/My-AI-Slaves-arm64.dmg
              packages/desktop/release/My-AI-Slaves-x64.dmg
          - os: windows-latest
            platform: win
            files: |
              packages/desktop/release/My-AI-Slaves-Setup.exe
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # The packaged app reports the root package.json version, which the
      # updater compares against the latest release tag.
      - name: Set version
        shell: bash
        run: npm version "${{ needs.version.outputs.version }}" --no-git-tag-version

      - name: Install dependencies
        run: npm ci

      - name: Build and package
        run: npm run desktop:dist -- --${{ matrix.platform }}
        env:
          # No Apple Developer ID: don't go looking for one in the keychain.
          # scripts/after-pack.cjs ad-hoc signs the macOS app instead.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  # The tag goes on the "chore: bump version" commit, so the tag, package.json
  # and package-lock.json always agree. That commit (and its tag) only land once
  # the installers are built and uploaded to a draft release; the draft is
  # published last. A run that fails before then leaves main and the tags as
  # they were.
  release:
    needs: [version, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      # To start a new release run when main moved during this one.
      actions: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      SHA: ${{ needs.version.outputs.sha }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      # The exact commit that was built, so the bump commit sits right on top of it.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      # A draft left by an earlier failed attempt at this version.
      - name: Remove stale draft
        run: |
          if [ "$(gh release view "v$VERSION" --json isDraft -q .isDraft 2>/dev/null)" = "true" ]; then
            gh release delete "v$VERSION" --yes
          fi

      # A draft has no tag yet and isn't offered by the in-app updater
      # (/releases/latest skips drafts). GitHub records a sha256 digest for every
      # uploaded asset; the updater verifies each download against it.
      - name: Create draft release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION }}
          name: v${{ env.VERSION }}
          draft: true
          generate_release_notes: true
          files: |
            release/My-AI-Slaves-arm64.dmg
            release/My-AI-Slaves-x64.dmg
            release/My-AI-Slaves-Setup.exe

      # Pushed with GITHUB_TOKEN, so this commit doesn't start another release.
      # The branch and the tag are pushed atomically: both land or neither does.
      # The push only succeeds while main is still the built commit; if commits
      # arrived during the build, this release is dropped (no bump, no tag) and
      # a fresh run releases the new tip, which includes these changes.
      - name: Commit version bump and tag it
        id: bump
        run: |
          npm version "$VERSION" --no-git-tag-version
          git config user.name "Ralph Largo"
          git config user.email "devlargs@gmail.com"
          git add package.json package-lock.json
          git commit -m "chore: bump version to v$VERSION"
          git tag "v$VERSION"
          if git push --atomic origin "HEAD:refs/heads/${GITHUB_REF_NAME}" "refs/tags/v$VERSION"; then
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          else
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        if: steps.bump.outputs.pushed == 'true'
        run: gh release edit "v$VERSION" --tag "v$VERSION" --draft=false --latest

      # Runs started by GITHUB_TOKEN pushes don't trigger workflows, but
      # workflow_dispatch does; it waits behind this run (see concurrency).
      - name: Drop release and start a new run
        if: steps.bump.outputs.pushed != 'true'
        run: |
          gh release delete "v$VERSION" --yes
          gh workflow run release.yml --ref "${GITHUB_REF_NAME}"
          echo "::notice::main moved during the build; v$VERSION was not released. A new run releases the current main."
