  <rect x="6" y="13.5" width="15" height="5" rx="2.5" fill="#fbf9f7"/>
  <rect x="6" y="21" width="10" height="5" rx="2.5" fill="#fbf9f7" fill-opacity="0.4"/>
</svg>
